name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: Directory.Packages.props
      - run: dotnet restore BacklinkStudio.sln
      - run: dotnet format BacklinkStudio.sln --verify-no-changes --no-restore
      - run: dotnet build BacklinkStudio.sln -c Release --no-restore
      - run: dotnet test BacklinkStudio.sln -c Release --no-build
        env:
          BACKLINKSTUDIO_RUN_CONTAINER_TESTS: "1"
          BACKLINKSTUDIO_RUN_FAILURE_TESTS: "1"
      - run: dotnet list BacklinkStudio.sln package --vulnerable --include-transitive
      - run: dotnet list BacklinkStudio.sln package --deprecated --include-transitive
      - run: bash -n scripts/*.sh
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-postgres-password-placeholder
          REDIS_PASSWORD: ci-redis-password-placeholder
          BACKLINKSTUDIO_BOOTSTRAP_API_KEY: bls_ci_placeholder_012345678901234567890123456789
      - run: docker build -t backlinkstudio:${{ github.sha }} .

  windows-compile:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: Directory.Packages.props
      - run: dotnet restore BacklinkStudio.sln
      - run: dotnet build BacklinkStudio.sln -c Release --no-restore
      - run: dotnet publish src/BacklinkStudio.Api -c Release -r win-x64 --self-contained false
      - run: dotnet publish src/BacklinkStudio.Mcp -c Release -r win-x64 --self-contained false
      - run: dotnet publish src/BacklinkStudio.Worker -c Release -r win-x64 --self-contained false
      - run: dotnet publish src/BacklinkStudio.Cli -c Release -r win-x64 --self-contained false
